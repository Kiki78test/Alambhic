# Fabrique l'appli Android d'Alamb'hic (dossier mobile/, enveloppe Capacitor) à chaque modification de ce dossier,
# ou à la demande (onglet Actions → « Appli Android » → Run workflow). Repris d'Airmony.
# Le fichier à installer est publié dans « Releases » → « Appli Android (test) » (tag appli-android).
# Version de test signée avec une clé de développement (mobile/native/android/alambhic-test.jks) : pour les essais, pas pour Google Play.
# Version Google Play : si les secrets ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS et ANDROID_KEY_PASSWORD
# existent, un fichier .aab signé est aussi fabriqué (Releases → « Appli Android (Google Play) »).
name: Appli Android
on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: appli-android
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      AM_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
      - run: echo "AM_VERSION_NAME=$(node -p "require('./package.json').version")" >> $GITHUB_ENV
      - run: npx cap add android
      - run: python3 native/android/patch_android.py android
      - run: npx cap sync android
      - name: Compiler
        working-directory: mobile/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Alambhic-Android-test.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: appli-android
          name: Appli Android (test)
          body: Version de test de l'appli Android d'Alamb'hic, fabriquée automatiquement à chaque modification du dossier mobile/. Sur le téléphone Android, télécharger le fichier .apk ci-dessous, l'ouvrir et autoriser l'installation depuis cette source. Elle remplace la version de test déjà installée.
          files: mobile/Alambhic-Android-test.apk
          overwrite_files: true
          make_latest: false
      - name: Clé de publication (Google Play)
        id: ks
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"; echo "on=1" >> "$GITHUB_OUTPUT"; else echo "Pas de clé de publication : version Google Play non fabriquée."; fi
      - name: Compiler la version Google Play (.aab signé)
        if: steps.ks.outputs.on == '1'
        working-directory: mobile/android
        env:
          AM_KS_FILE: ${{ runner.temp }}/upload.jks
          AM_KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          AM_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon
      - if: steps.ks.outputs.on == '1'
        run: cp android/app/build/outputs/bundle/release/app-release.aab "Alambhic-Android-${AM_VERSION_NAME}-${AM_VERSION_CODE}.aab" && rm -f "$RUNNER_TEMP/upload.jks"
      - if: steps.ks.outputs.on == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: appli-android-play
          name: Appli Android (Google Play)
          body: Version à envoyer dans la Google Play Console. Signée avec la clé de publication ; le numéro de version augmente à chaque fabrication.
          files: mobile/Alambhic-Android-*.aab
          overwrite_files: true
          make_latest: false
          prerelease: true
