# Blueprint Render : service web + base PostgreSQL, offre gratuite pour les tests.
databases:
  - name: alambhic-db
    plan: basic-256mb   # ≈ 6 $/mois ; pas d'expiration, sauvegardes quotidiennes
    region: frankfurt
    databaseName: youdrink
    user: youdrink

services:
  - type: web
    name: alambhic
    runtime: node
    plan: starter       # 7 $/mois : pas de mise en veille
    region: frankfurt
    buildCommand: npm install --omit=dev
    startCommand: node server/index.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: alambhic-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: MONITOR_KEY         # clé du tableau de bord de contrôle (même valeur sur les 4 applis)
        sync: false
      - key: MONITOR_ORIGIN      # adresse du tableau de bord, ex. https://controle.airmonylive.com
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: RESEND_API_KEY      # e-mails (mot de passe oublié) : même équipe Resend qu'Airmony
        sync: false
      - key: MAIL_FROM           # ex. Alamb'hic <noreply@domaine-vérifié-dans-Resend>
        sync: false
      - key: BASE_URL            # adresse publique, ex. https://alambhic.onrender.com (liens des e-mails)
        sync: false
      - key: ANTHROPIC_API_KEY   # facultatif : l'aide reformule ses réponses avec l'IA
        sync: false
