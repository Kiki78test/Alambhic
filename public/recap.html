<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Récap de soirée · Alamb'hic</title>
<meta name="description" content="Le récapitulatif d'une soirée Alamb'hic : courbes, avatars et titres.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a1626">
<link rel="icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#0a1626;--surface:#10233b;--surface2:#16304f;--line:#24446e;--fg:#f4f8ff;--muted:#9fb3cc;--accent:#2f8cff;--ok:#5bc88a;--warn:#ffd34d;--bad:#ff6b6b;--care:#ff9f43;--gold:#ffcf4a;
 --display:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;--body:Inter,system-ui,sans-serif;color-scheme:dark}
html,body{background:var(--bg);color:var(--fg)}
body{margin:0;font-family:var(--body);font-size:15px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.wrap{max-width:720px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;padding-block:14px;border-bottom:1px solid var(--line)}
header img{height:34px}
h1,h2{font-family:var(--display);font-weight:800;margin:0;text-wrap:balance}
h1{font-size:30px;line-height:1.1}h2{font-size:20px}
section{display:flex;flex-direction:column;gap:12px;padding-block:18px}
.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.pc b.nm{font-family:var(--display);font-size:20px}
.pc .pk{font-size:13px;color:var(--muted)}
.badges{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.badge{font-size:12px;padding:4px 8px;border-radius:9px;background:var(--surface2);border:1px solid var(--line)}
.badge.trophy{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 60%,transparent)}
.badge.shame{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 60%,transparent)}
.badge.care{color:var(--care);border-color:color-mix(in srgb,var(--care) 60%,transparent)}
.score{font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 8px}
.chart{overflow-x:auto}.chart svg{display:block;width:100%;height:auto;min-width:300px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.ev{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.ev .t{color:var(--muted);font-size:13px;width:44px;flex:none;font-variant-numeric:tabular-nums}
.ev b{display:block}
.cta{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;font-weight:600;border-radius:12px;padding:12px 18px;align-self:flex-start}
.note{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
.err{background:color-mix(in srgb,var(--warn) 14%,transparent);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);border-radius:10px;padding:12px}
</style>
</head>
<body>
<div class="wrap">
<header><a href="/"><img src="/logo.png" alt="Alamb'hic"></a><span class="muted" style="font-size:13px">Récap de soirée</span></header>
<main id="app"><section><p class="muted">Chargement…</p></section></main>
</div>
<script src="/i18n.js"></script>
<script src="/engine.js"></script>
<script src="/avatar.js"></script>
<script>
"use strict";
const MIN=60000, COLORS=["#f7941d","#5ab0ff","#5bc88a","#e879f9","#f2c94c","#ff7a6e","#7dd3fc","#c4b5fd","#fda4af","#a3e635"];
const $=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=b=>Math.max(0,b).toFixed(2).replace(".",",");
const hm=t=>new Date(t).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
let T0=Date.now(); const NOW=()=>T0;
function chart(list,now){
  const withD=list.filter(p=>p.sim.pts&&p.sim.pts.length); if(!withD.length) return "";
  const t0=Math.min(...withD.map(p=>p.sim.pts[0][0])), t1=Math.max(...withD.map(p=>p.sim.zeroT||p.sim.pts[p.sim.pts.length-1][0]));
  const ymax=Math.max(1,...withD.map(p=>p.sim.peak))*1.1, W=700,H=280,L=34,R=10,T=12,B=26;
  const X=t=>L+(t-t0)/Math.max(1,t1-t0)*(W-L-R), Y=b=>T+(1-b/ymax)*(H-T-B);
  let g="";
  for(const [v,c] of [[0.5,"var(--warn)"],[0.8,"var(--accent)"],[1.2,"var(--bad)"]]) if(v<ymax) g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="${c}" stroke-opacity=".45" stroke-dasharray="3 4"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" fill="var(--muted)" font-size="11">${fmt(v)}</text>`;
  let th=new Date(t0); th.setMinutes(0,0,0); th=th.getTime()+3600e3; const step=t1-t0>8*3600e3?2:1;
  for(;th<t1;th+=step*3600e3) g+=`<text x="${X(th)}" y="${H-8}" text-anchor="middle" fill="var(--muted)" font-size="11">${new Date(th).getHours()}h</text>`;
  for(const p of withD){ const d=p.sim.pts.filter(x=>x[0]<=t1).map((x,i)=>(i?"L":"M")+X(x[0]).toFixed(1)+" "+Y(x[1]).toFixed(1)).join("");
    g+=`<path d="${d}" fill="none" stroke="${p.color}" stroke-width="2.5" stroke-linejoin="round"/>`;
    if(p.sim.peakT) g+=`<circle cx="${X(p.sim.peakT)}" cy="${Y(p.sim.peak)}" r="4" fill="${p.color}"/>`; }
  return `<section><h2>Les courbes de la soirée</h2><div class="card"><div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Courbes de la soirée">${g}</svg></div></div>
  <div class="legend">${withD.map(p=>`<span><i style="background:${p.color}"></i><b data-noi18n>${esc(p.pseudo)}</b> · pic ${fmt(p.sim.peak)}</span>`).join("")}</div></section>`;
}
(async function(){
  const tok=location.pathname.split("/").pop();
  try{
    const r=await fetch("/api/recap/"+encodeURIComponent(tok)), d=await r.json(); if(!r.ok) throw new Error(d.error||"Erreur");
    T0=d.now; const list=d.members.map((m,i)=>({...m,color:COLORS[i%COLORS.length]}));
    const date=new Date(d.date).toLocaleDateString(I18N.lang==="fr"?"fr-FR":I18N.lang,{weekday:"long",day:"numeric",month:"long"});
    const best=list.slice().sort((a,b)=>b.score-a.score);
    const ev=list.flatMap(p=>p.ev).filter(e=>e.kind!=="info").sort((a,b)=>a.t-b.t);
    $("#app").innerHTML=`<section><h1>Notre soirée du ${esc(date)}</h1><p class="muted" style="margin:0">${list.length} joueur${list.length>1?"s":""} · ${ev.length} titre${ev.length>1?"s":""} débloqué${ev.length>1?"s":""}</p></section>
    ${list.length?`<section><h2>Les joueurs</h2><div class="grid">${best.map((p,i)=>{ const at={...p,sim:{...p.sim,cur:p.sim.peak,prev:p.sim.peak},drinks:[]};
      return `<div class="pc">${avatar(at,120)}<b class="nm" data-noi18n>${i===0&&p.score>0?"🏆 ":""}${esc(p.pseudo)}</b><span class="pk">Pic ${fmt(p.sim.peak)} g/L${p.sam?" · Sam":""}</span><span class="score">${p.score>0?"+":""}${p.score} pts</span>
      <div class="badges">${p.ev.filter(e=>e.kind!=="info").map(e=>`<span class="badge ${e.kind}">${esc(e.title)}</span>`).join("")}</div></div>`}).join("")}</div></section>
    ${chart(list,d.now)}
    <section><h2>Le fil des titres</h2>${ev.map(e=>`<div class="ev"><span class="t">${hm(e.t)}</span><div><b>${esc(e.title)}</b><span class="muted" style="font-size:13px">${esc(e.text)}</span></div></div>`).join("")||`<p class="muted">Aucun titre cette fois.</p>`}</section>`
    :`<section><p class="muted">Aucun joueur n'a choisi d'apparaître dans ce récap.</p></section>`}
    <section><a class="cta" href="/">Créer votre soirée sur Alamb'hic</a>
    <p class="note">Avatars montrés au pic de chacun. Taux estimés par la formule de Widmark : jamais une autorisation de conduire. Seuls les joueurs qui l'ont accepté apparaissent ici, avec leur pseudo uniquement.</p></section>`;
  }catch(e){ $("#app").innerHTML=`<section><div class="err">${esc(e.message)}</div><a class="cta" href="/">Découvrir Alamb'hic</a></section>` }
  I18N.apply(document.body);
})();
</script>
</body>
</html>
