# Contrôle de sécurité des dépendances (express, pg, ws, web-push, bcryptjs) : chaque lundi et à chaque changement de package.json.
# En cas de faille connue de gravité haute ou critique, l'exécution échoue (onglet Actions, e-mail de GitHub). Repris d'Airmony.
name: Sécurité des dépendances
on:
  schedule:
    - cron: '23 6 * * 1'
  push:
    branches: [main]
    paths: ['package.json', 'package-lock.json', '.github/workflows/securite.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm audit --omit=dev --audit-level=high
